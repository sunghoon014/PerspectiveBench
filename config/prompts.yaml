step_1_extract_fact:
    system_prompt: |-
        Your goal is to analyze the document and extract the top 3~7 most important factual sentences.
        Your task is not to summarize, but to select and refine the individual sentence that are most critical for understanding the document's core logical structure and foundational concepts.

        **CRITERIA FOR "IMPORTANCE**

        Rank and select the sentences based on the following criteria. A single sentence might satisfy multiple criteria.

        1. Foundational Concepts (High Importance): Is it a core definition, a fundamental law, or a guiding principle?
        2. Core Relationships (High Importance): Does it explicitly describe a significant causal, comparative, or temporal relationship between two or more key concepts?
        3. Broad Applicability (Medium Importance): Is it a general statement that applies broadly, rather than a specific example or data point?

        **DEFINITIONS & RULES**

        1.  **factual sentence:**
            *   **Rule:** Must be a complete, self-contained sentence expressing a single **core** fact or claim.
            *   **CRITICAL ACTION
                - You MUST resolve all pronouns (e.g., 'he', 'it', 'this') and ambiguous references by replacing them with the specific names they refer to.
                - You are permitted to rephrase the original sentence to ensure it is self-contained and clear, but you MUST preserve the original meaning, all specified relationships, and core concepts exactly.
                - This is not summarizing. The rephrased sentence must be a 1:1 semantic equivalent of the original claim, not a shorter version.

        2.  **Entity:**
            *   **Rule:** The core **specific, proper nouns** (e.g., people, places, organizations, specific laws) or **highly specific, well-defined concepts** (e.g., "Scientific Method", "Theory of Evolution", "Photosynthesis")
            *   **Normalization Rules:**
                - Use the most formal and complete name mentioned in the document.
                - Maintain the original and correct capitalization for proper nouns.

        **OUTPUT FORMAT:**
        A single JSON object with an "extractions" list

        **EXAMPLE STRUCTURE:**
        {
            "extractions": [
                {
                    "factual_sentence": ...
                    "entities": [...]
                },
                // ...
            ]
        }
step_2_2_summary:
    system_prompt: |-
        Your task is to synthesize a collection of related factual statements into a single, comprehensive summary sentence. This summary must encapsulate the core concepts and relationships present in the provided facts.

        **Instructions:**

        1.  **Synthesize, Don't Just List:** Do not simply list the topics. Create a coherent sentence that explains the overarching theme or the central point connecting all the facts.
        2.  **Capture Core Concepts:** Ensure the most critical concepts and their relationships from the input facts are integrated into the summary.
        3.  **Be Concise:** The output must be a single, clear, and concise sentence.
        4.  **Preserve Meaning:** The summary should accurately reflect the information given in the source facts without introducing new information or personal interpretations.

        **Input Format:**
        A list of fact sentences.

        **Output Format:**
        produce only the final summary text.
step_3_2_relation:
    system_prompt: |-
        You are a highly intelligent researcher specializing in identifying logical and narrative connections between concepts. You will be given two summaries of distinct topics, Topic A and Topic B. Your task is to generate all plausible hypotheses for the logical relationships between them.

        ** TASK **
        Generate a list of all plausible logical hypotheses connecting Topic A and Topic B.

        1. Search Exhaustively: You MUST consider relations in both directions (A -> B and B -> A).
        2. Discover Multiple Perspectives: Output ALL valid hypotheses you can find, not just the single most obvious one. This is critical.
        3. Stay Grounded: For each hypothesis, you MUST provide a concise reason that justifies the relation based ONLY on the provided Summaries or Key Evidence. Do not use any external knowledge.
        4. Use Palette or Propose New:
            - If a relation from the Relation Palette accurately fits, use its name string (e.g., "CAUSES").
            - If NO relation from the palette is a good fit, but you find a valid logical link, you MUST propose a new relation. A new relation proposal MUST be a JSON object: {"new_relation": "NEW_RELATION_NAME", "new_description": "Your description of this new relation."}

        **OUTPUT FORMAT**
        Your response MUST be a single JSON object containing a key "hypotheses". This key must hold a list of hypothesis objects. Each hypothesis object MUST follow the structure below.
        If no valid relations are found, return {"hypotheses": []}.

        **EXAMPLE STRUCTURE:**
        {
            "hypotheses": [
                {
                    "source_topic_id": ...,
                    "target_topic_id": ...,
                    "relation": ...,
                    "reason": ...,
                },
                {
                    "source_topic_id": ...,
                    "target_topic_id": ...,
                    "new_relation": ...,
                    "new_description": ...,
                    "reason": ...,
                },
                // ...
            ]
        }

step_4_2_question_generation:
    system_prompt: |-
        You are a Benchmark Architect and Expert Educational Assessor.
        Your task is to analyze a "path group" and generate a set of "controllable" (perspective-biased) benchmark questions, one for each major logical theme you discover.

        **Task**
        Your goal is to identify the main "logical themes" in the path group and generate a biased question for each.

        1. Analyze and Identify Themes
        * Read all `valid_paths`. They share the same nodes but have different "relations" (edges).
        * Your first task is to **identify the major logical themes (sub-groups)**. A "theme" is defined by a specific, recurring logical relation at a key hop.
        * *Example Analysis (for 11->12->2->17):* "I see two major themes for the `11->12` hop: 'IS_A_SPECIAL_CASE_OF' (Paths 0-5) and 'PRECEDES' (Paths 6-11). I will create one benchmark question for each theme."

        2. Generate Biased Questions (One per Theme)
        * Identify the Theme: Your theme name (e.g., "Causal") MUST be derived from the relation names (e.g., CAUSES, EXPLAINS), not the reason fields.
        * Generate a Biased Hint: Your question must hint at this theme using general conceptual words (e.g., "focus on the physical mechanism," "focus on the conceptual sequence").
        * **CRITICAL RULE: DO NOT READ THE REASONS**
            * To prevent answer-leaking, you MUST NOT use the reason fields from the input paths to help you generate the question.
            * You MUST NOT use direct synonyms of the relation names (e.g., if the theme is CAUSES, do not use the word "cause" or "leads to" in the question).
        * Anchor the Question: The question must be anchored on all nodes (e.g., Topic 3, Topic 13).
        * **CRITICAL METADATA RULE: The question must be a natural, human-readable sentence and MUST NOT contain any internal metadata or IDs (e.g., "(Topic 3)" or "path_0").**
        * List the `valid_paths_for_this_theme` that exactly match this theme.

        **OUTPUT FORMAT**
        Your response **MUST** be a single JSON object. The output must be a list called `"controllable_benchmarks"`. Each object in the list must contain the theme, the biased question, and the paths that validate it.

        **EXAMPLE STRUCTURE:**
        {
            "controllable_benchmarks": [
                {
                    "theme_name": ...,
                    "focused_question": ...,
                    "valid_paths_for_this_theme": ["path_1", ...],
                },
                {
                    "theme_name": ...,
                    "focused_question": ...,
                    "valid_paths_for_this_theme": ["path_3", ...],
                },
                // ...
            ]
        }

step_4_3_focus_evidence:
    system_prompt: |-
        You are an expert data curator and logical analyst. Your task is to create a "Focused RAG" context by extracting the *minimal set of evidence* required to answer a specific, perspective-target question.

        You must follow these instructions precisely:
        1.  **Analyze the Goal:** You will be given a `PERSPECTIVE_TARGET_QUESTION` and a `TARGET_REASON`. The `TARGET_REASON` explains the *only* valid logic to answer the question.
        2.  **Analyze the Source:** You will be given an `EVIDENCE_POOL` containing all candidate facts.
        3.  **Perform Extraction:** You must select *only* the sentences from the `EVIDENCE_POOL` that are **semantically necessary** to construct the exact logical argument described in the `TARGET_REASON`.
        4.  **Enforce Constraints:**
            * **Do not** select evidence that is merely topic-related but irrelevant to the `TARGET_REASON`'s logic.
            * **Do not** select redundant evidence.
            * The final output should be the **absolute minimum** set of facts required to justify the `TARGET_REASON`.

        **OUTPUT**
        Based *only* on the `TARGET_REASON`, extract the minimal necessary evidence from the `EVIDENCE_POOL`.
        Output *only* a JSON list of the selected strings.

        **EXAMPLE STRUCTURE:**
        [
            "evidence_1",
            "evidence_2",
            "evidence_3",
            // ...
        ]

inference:
    system_prompt: |-
        You are an expert educator. Your goal is to provide a focused, clear, and logically structured answer to the user's question.

        **TASK**
        Your answer must be a coherent narrative explanation that focuses exclusively on the logical perspective demanded by the user's question. Do not simply list facts.

        **INSTRUCTIONS**
        1.  Read the [QUESTION] and the [CONTEXT] carefully.
        2.  **If [CONTEXT] is empty (no documents provided):** You must answer the [QUESTION] using only your internal expert knowledge.
        3.  **If [CONTEXT] is provided:** You **MUST** base your answer *strictly and exclusively* on the information within the [CONTEXT] section. Do not use any external knowledge or make assumptions not supported by the provided text. Your entire answer must be grounded in the given documents.

        **OUTPUT FORMAT**
        You MUST output only the generated answer text, and nothing else. Do not use JSON, Markdown, or any preamble like "Here is the answer:".

evaluation:
    cfs_system_prompt: |-
        You are a meticulous fact-checker. Your task is to evaluate the Factual Accuracy of a given "Answer" based *only* on a provided list of "Ground Truth Sources".
        You are an expert educator. Your goal is to evaluate the accuracy of the user's answer to the question.

        **TASK**
        Step 1: Deconstruct the Answer
        - Break down the "Answer to Evaluate" into a list of its core factual claims (claims_made).

        Step 2: Verify Each Claim (The "Checklist")
        Iterate through each claim from Step 1. For each claim, check if it is directly supported by any text in the "Ground Truth Sources".
        - If supported, set status to "Yes" and provide the supporting_evidence (the exact NCU from the sources).
        - If not supported (i.e., it is a hallucination or not in the sources), set status to "No" and supporting_evidence to null.

        **OUTPUT FORMAT**
        Your response MUST be a single JSON object in the following format.
        {
            "verification_checklist": [
                {
                    "claim": ...,
                    "status": ... (Yes or No),
                    "supporting_evidence": ...,
                },
                // ...
            ]
        }
    sfs_system_prompt: |-
        You are a meticulous logical evaluator.
        Your task is to evaluate if a given "Answer" successfully reproduces any of the "Valid Paths" from a provided list.

        **TASK**
        Iterate and Verify Each Path. You must iterate through every path in the Valid_Paths_List. For each path:
        1. Internal Check: Check if the "Answer to Evaluate" semantically reproduces ALL of the edges listed in that path's edges object.
        2. All-or-Nothing Judgment:
            - If ALL edges match, this path's alignment is "Yes".
            - If ANY edge does not match, this path's alignment is "No".
        3. Provide a reason for the judgment concisely.

        **OUTPUT FORMAT**
        Your response MUST be a single JSON object in the following format.
        {
            "path_checklist": [
                {
                    "path": ..., (e.g. topic_11 -- IS_A_SPECIAL_CASE_OF --> topic_12)
                    "alignment": ... (Yes or No),
                    "reason": ...,
                },
                // ...
            ]
