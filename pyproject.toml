[project]
name = "perspectivebench"
version = "1.1.0"
description = "Evaluating perspective alignment in large language models"
authors = [
    { name = "Sunghoon Kim", email = "sunghoon.kim@coxwave.com" },
    { name = "Sangyeop Kim", email = "sangyeopkim@coxwave.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <3.13"
dependencies = [
    "openai>=1.35.10,<2.0.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=0.21.0,<2.0.0",
]

[project.optional-dependencies]
construction = [
    "pydantic-settings>=2.3.4,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "tqdm>=4.66.4",
    "loguru>=0.7.3",
    "dependency-injector[yaml]>=4.48.1",
    "scipy>=1.16.1",
    "scikit-learn>=1.7.1",
    "networkx>=3.5",
    "bertopic>=0.17.3",
    "transformers>=4.57.1,<5.0.0",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "tenacity>=8.2.3",
]

[dependency-groups]
dev = ["ruff>=0.5.0"]

[tool.uv]
package = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# 무시할 규칙들
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in __init__
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function calls in argument defaults
]

unfixable = ["F401", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]
